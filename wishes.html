<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Céu de Desejos - Lovify</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(to bottom, #020205, #08071a, #110e2d);
            overflow: hidden;
        }
        /* Glassmorphism */
        .glass-panel {
            background: rgba(17, 17, 27, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(245, 158, 11, 0.2);
        }
        /* Estrela cintilante */
        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            pointer-events: none;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        /* Oscilação horizontal das lanternas (Efeito Balanço) */
        @keyframes sway {
            0%, 100% { transform: translateX(0px); }
            50% { transform: translateX(20px); }
        }
        /* Subida das lanternas */
        @keyframes float-up {
            0% {
                transform: translateY(105vh) scale(0.9);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 0.9;
            }
            100% {
                transform: translateY(-15vh) scale(0.35);
                opacity: 0;
            }
        }
        /* Classe base para lanternas flutuantes */
        .lantern {
            position: absolute;
            pointer-events: none;
            display: flex;
            flex-col: column;
            align-items: center;
        }
        /* Efeito de chama oscilante na base */
        .fire-flicker {
            animation: flicker 0.15s infinite alternate;
        }
        @keyframes flicker {
            0% { transform: scale(0.95); opacity: 0.8; }
            100% { transform: scale(1.05); opacity: 1; filter: brightness(1.2); }
        }
    </style>
</head>
<body class="text-white w-screen h-screen relative">

    <!-- Fundo de Estrelas Cintilantes -->
    <div id="stars-container" class="absolute inset-0 z-0"></div>

    <!-- Cabeçalho Fixo -->
    <header class="absolute top-0 left-0 w-full p-6 flex justify-between items-center z-40 bg-gradient-to-b from-black/80 to-transparent">
        <a href="lovify.html" class="flex items-center gap-2 text-zinc-400 hover:text-amber-400 font-bold transition hover:scale-105">
            <i class="fa-solid fa-arrow-left"></i>
            <span>Voltar para Lovify</span>
        </a>
        <div class="text-amber-400 font-extrabold text-xl tracking-wider uppercase flex items-center gap-2">
            <i class="fa-solid fa-fire-flame-curved animate-pulse"></i>
            <span>Céu de Desejos</span>
        </div>
    </header>

    <!-- CONTAINER DAS LANTERNAS -->
    <div id="lanterns-container" class="absolute inset-0 z-10 overflow-hidden"></div>

    <!-- PAINEL DE ENTRADA (SOLTAR DESEJO) -->
    <div class="absolute bottom-8 left-1/2 -translate-x-1/2 w-full max-w-lg px-4 z-30">
        <div class="glass-panel p-6 rounded-2xl shadow-[0_0_40px_rgba(245,158,11,0.15)] flex flex-col gap-4">
            <div>
                <h2 class="text-lg font-bold text-amber-300">Faça um Desejo</h2>
                <p class="text-xs text-zinc-400 mt-1">Digite um desejo para o nosso amor e solte-o no céu eterno.</p>
            </div>
            <form onsubmit="releaseCustomWish(event)" class="flex gap-2">
                <input type="text" id="wish-input" maxlength="80" required
                    placeholder="Ex: Que nossa cumplicidade cresça sempre mais..."
                    class="flex-1 bg-zinc-950/80 border border-zinc-700/60 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400 transition placeholder-zinc-500">
                <button type="submit"
                    class="bg-gradient-to-r from-amber-500 to-orange-600 hover:opacity-95 text-black font-extrabold px-5 rounded-xl transition hover:scale-[1.03] flex items-center gap-2 text-sm shadow-lg shadow-orange-500/20">
                    Soltar <i class="fa-solid fa-paper-plane text-xs"></i>
                </button>
            </form>
        </div>
    </div>

    <script>
        const starsContainer = document.getElementById('stars-container');
        const lanternsContainer = document.getElementById('lanterns-container');
        const wishInput = document.getElementById('wish-input');

        // 1. Gerar Estrelas Estáticas/Cintilantes no fundo
        function generateStars() {
            const count = 150;
            for (let i = 0; i < count; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 2 + 0.5;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.left = `${Math.random() * 100}vw`;
                star.style.top = `${Math.random() * 80}vh`;
                
                // Cintilação aleatória
                star.style.animation = `twinkle ${Math.random() * 4 + 2}s infinite ease-in-out`;
                star.style.animationDelay = `${Math.random() * 3}s`;
                
                starsContainer.appendChild(star);
            }
        }

        // 2. Criar uma Lanterna Visual
        function createLantern(text = "", isCustom = false) {
            const lanternEl = document.createElement('div');
            lanternEl.className = 'lantern';

            // Velocidade e drift aleatórios
            const duration = isCustom ? (Math.random() * 4 + 18) : (Math.random() * 6 + 22); // Segundos para subir
            const leftPos = isCustom ? (30 + Math.random() * 40) : (Math.random() * 95); // Centraliza mais os desejos do usuário
            const swayDuration = Math.random() * 4 + 4;
            const swayDelay = Math.random() * -5;

            // Configurar estilos CSS dinâmicos
            lanternEl.style.left = `${leftPos}vw`;
            lanternEl.style.bottom = `-120px`; // Começa abaixo da tela
            lanternEl.style.animation = `float-up ${duration}s linear forwards`;

            // HTML Interno da Lanterna (Desenho da Lanterna com SVG e Glow)
            const scale = isCustom ? 1.2 : (0.5 + Math.random() * 0.5); // Desejos do usuário são ligeiramente maiores
            const opacity = isCustom ? 1.0 : (0.4 + Math.random() * 0.5);

            // Container visual interno para o efeito de sway (balanço horizontal)
            const visualWrapper = document.createElement('div');
            visualWrapper.className = 'flex flex-col items-center';
            visualWrapper.style.animation = `sway ${swayDuration}s ease-in-out infinite alternate`;
            visualWrapper.style.animationDelay = `${swayDelay}s`;
            visualWrapper.style.transform = `scale(${scale})`;
            visualWrapper.style.opacity = opacity;

            // 1. Lanterna (Balão)
            const balloon = document.createElement('div');
            balloon.className = 'w-10 h-14 bg-gradient-to-t from-orange-500 via-amber-400 to-yellow-100 rounded-t-3xl rounded-b-lg shadow-[0_0_25px_#f59e0b] relative flex flex-col justify-end items-center pb-1 border-b border-amber-600/30';
            
            // Fogo aceso na base da lanterna
            const fire = document.createElement('div');
            fire.className = 'w-3 h-4 bg-gradient-to-t from-red-600 via-amber-400 to-yellow-200 rounded-full fire-flicker';
            balloon.appendChild(fire);

            visualWrapper.appendChild(balloon);

            // 2. Texto do Desejo (se houver)
            if (text) {
                const label = document.createElement('div');
                label.className = 'mt-3 text-[11px] md:text-xs font-semibold text-yellow-100 bg-zinc-950/80 px-3 py-1.5 rounded-full border border-amber-500/20 whitespace-nowrap shadow-[0_0_15px_rgba(245,158,11,0.1)]';
                label.innerText = text;
                visualWrapper.appendChild(label);
            }

            lanternEl.appendChild(visualWrapper);
            lanternsContainer.appendChild(lanternEl);

            // Destruir elemento do DOM após a animação de subida acabar
            setTimeout(() => {
                lanternEl.remove();
            }, duration * 1000);
        }

        // 3. Gerador Procedural de Lanternas em Segundo Plano (Ambiente)
        const sampleWishes = [
            "Amor eterno", "Mais viagens juntos", "Sempre de mãos dadas", "Risadas infinitas", 
            "Cafés da manhã na cama", "Cumplicidade", "Superar desafios juntos", 
            "Nossa casinha", "Saúde e paz", "Mais noites de filme", "Te amar cada dia mais",
            "Muitos abraços apertados", "Construir uma família", "Parceria eterna", "Nossos sonhos realizados"
        ];

        function spawnBackgroundLanterns() {
            // Solta uma lanterna de fundo aleatoriamente a cada 3 a 6 segundos
            createLantern(sampleWishes[Math.floor(Math.random() * sampleWishes.length)], false);
            
            const nextSpawn = Math.random() * 3000 + 2500;
            setTimeout(spawnBackgroundLanterns, nextSpawn);
        }

        // 4. Soltar Desejo Personalizado do Usuário
        function releaseCustomWish(event) {
            event.preventDefault();
            const text = wishInput.value.trim();
            if (text) {
                createLantern(text, true);
                wishInput.value = "";
            }
        }

        // Inicializar Página
        generateStars();
        
        // Spawn inicial de algumas lanternas de fundo
        for (let i = 0; i < 6; i++) {
            setTimeout(() => {
                // Posicionar em alturas aleatórias para preencher o céu na inicialização
                const lanternEl = document.createElement('div');
                lanternEl.className = 'lantern';
                const leftPos = Math.random() * 95;
                const progress = Math.random() * 0.8; // inicia já no ar
                const duration = Math.random() * 6 + 22;

                lanternEl.style.left = `${leftPos}vw`;
                lanternEl.style.bottom = `${progress * 100}vh`;
                lanternEl.style.animation = `float-up ${duration * (1 - progress)}s linear forwards`;

                const scale = 0.5 + Math.random() * 0.5;
                const opacity = 0.3 + Math.random() * 0.4;
                const swayDuration = Math.random() * 4 + 4;

                const visualWrapper = document.createElement('div');
                visualWrapper.className = 'flex flex-col items-center';
                visualWrapper.style.animation = `sway ${swayDuration}s ease-in-out infinite alternate`;
                visualWrapper.style.transform = `scale(${scale})`;
                visualWrapper.style.opacity = opacity;

                const balloon = document.createElement('div');
                balloon.className = 'w-10 h-14 bg-gradient-to-t from-orange-500 via-amber-400 to-yellow-100 rounded-t-3xl rounded-b-lg shadow-[0_0_25px_#f59e0b] relative flex flex-col justify-end items-center pb-1 border-b border-amber-600/30';
                const fire = document.createElement('div');
                fire.className = 'w-3 h-4 bg-gradient-to-t from-red-600 via-amber-400 to-yellow-200 rounded-full fire-flicker';
                balloon.appendChild(fire);
                visualWrapper.appendChild(balloon);

                const label = document.createElement('div');
                label.className = 'mt-3 text-[11px] text-yellow-100/70 bg-zinc-950/70 px-2 py-1 rounded-full border border-amber-500/10 whitespace-nowrap';
                label.innerText = sampleWishes[Math.floor(Math.random() * sampleWishes.length)];
                visualWrapper.appendChild(label);

                lanternEl.appendChild(visualWrapper);
                lanternsContainer.appendChild(lanternEl);

                setTimeout(() => { lanternEl.remove(); }, duration * (1 - progress) * 1000);
            }, i * 1200);
        }

        // Iniciar fluxo contínuo
        setTimeout(spawnBackgroundLanterns, 2000);
    </script>
</body>
</html>
