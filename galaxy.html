<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nossa Galáxia - Lovify</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #000;
        }
        /* Efeito vidro (Glassmorphism) */
        .glass-panel {
            background: rgba(24, 24, 27, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(236, 72, 153, 0.2);
        }
        /* Neon Glow */
        .neon-glow-pink {
            box-shadow: 0 0 25px rgba(236, 72, 153, 0.5);
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(236, 72, 153, 0.3);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(236, 72, 153, 0.6);
        }
    </style>
    <!-- Importar Three.js e OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body class="text-white overflow-hidden w-screen h-screen relative bg-black">

    <!-- Cabeçalho Fixo -->
    <header class="absolute top-0 left-0 w-full p-6 flex justify-between items-center z-40 bg-gradient-to-b from-black/80 to-transparent pointer-events-none">
        <a href="lovify.html" class="flex items-center gap-2 text-zinc-400 hover:text-pink-500 font-bold transition hover:scale-105 pointer-events-auto">
            <i class="fa-solid fa-arrow-left"></i>
            <span>Voltar para Lovify</span>
        </a>
        <div class="text-purple-400 font-extrabold text-xl tracking-wider uppercase flex items-center gap-2">
            <i class="fa-solid fa-meteor animate-pulse"></i>
            <span>Nossa Galáxia</span>
        </div>
    </header>

    <!-- Instruções Flutuantes -->
    <div class="absolute bottom-6 left-6 z-30 glass-panel p-4 rounded-xl text-zinc-300 text-xs max-w-xs space-y-2 pointer-events-none">
        <p class="font-semibold text-pink-400 flex items-center gap-1">
            <i class="fa-solid fa-circle-info"></i> Como navegar:
        </p>
        <p>• <strong>Arraste</strong> com o mouse para girar o espaço.</p>
        <p>• <strong>Scroll</strong> para aproximar (zoom) ou afastar.</p>
        <p>• <strong>Clique</strong> nas estrelas gigantes e coloridas para abrir lembranças.</p>
    </div>

    <!-- Canvas do Three.js -->
    <div id="canvas-container" class="w-full h-full absolute inset-0 z-10 cursor-grab active:cursor-grabbing"></div>

    <!-- MODAL DE MEMÓRIAS (Vidro Neon) -->
    <div id="memory-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-300">
        <div class="glass-panel w-full max-w-md rounded-2xl overflow-hidden shadow-2xl transform scale-95 transition-transform duration-300" id="modal-content">
            <!-- Header do Modal -->
            <div class="p-4 border-b border-pink-500/20 flex justify-between items-center bg-pink-900/10">
                <span id="memory-date" class="text-xs font-bold text-pink-400 tracking-wider uppercase">00/00/0000</span>
                <button onclick="closeMemoryModal()" class="text-zinc-400 hover:text-white transition">
                    <i class="fa-solid fa-xmark fa-lg"></i>
                </button>
            </div>
            <!-- Corpo do Modal -->
            <div class="p-6 space-y-4">
                <div class="relative w-full aspect-video rounded-lg overflow-hidden bg-zinc-950 border border-zinc-800">
                    <img id="memory-image" src="" class="w-full h-full object-cover" alt="Foto da Memória">
                </div>
                <h3 id="memory-title" class="text-xl font-bold text-white tracking-tight">Título da Memória</h3>
                <p id="memory-desc" class="text-sm text-zinc-300 leading-relaxed font-light">Descrição detalhada do momento romântico.</p>
            </div>
            <!-- Rodapé -->
            <div class="p-4 bg-zinc-900/50 border-t border-pink-500/10 flex justify-end">
                <button onclick="closeMemoryModal()" class="bg-pink-500 hover:bg-pink-400 text-black font-extrabold px-6 py-2 rounded-full text-xs uppercase tracking-wider transition">
                    Guardar no Peito
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- Dados das Memórias de Estrela ---
        const memories = [
            {
                id: 0,
                title: "O Primeiro Oi",
                date: "Nosso Começo",
                desc: "Aquele primeiro papo que parecia bobo, mas que secretamente nos tirou sorrisos e borboletas no estômago. O início de uma constelação inteira.",
                image: "https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80",
                localImage: "assets/images/primeiro_oi.jpg"
            },
            {
                id: 1,
                title: "Nosso Primeiro Encontro",
                date: "O Primeiro Sorriso Pessoalmente",
                desc: "O nervosismo das mãos frias, a timidez do olhar que se cruzava e, de repente, a certeza mágica de que estávamos prestes a começar a maior jornada de nossas vidas.",
                image: "https://images.unsplash.com/photo-1518199266791-5375a83190b7?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80",
                localImage: "assets/images/primeiro_encontro.jpg"
            },
            {
                id: 2,
                title: "O Pedido de Namoro",
                date: "O Dia do Nosso Sim",
                desc: "Quando o 'você e eu' se tornou oficialmente 'nós'. Uma promessa silenciosa e doce de sermos o porto seguro um do outro em qualquer estação.",
                image: "https://images.unsplash.com/photo-1515934751635-c81c6bc9a2d8?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80",
                localImage: "assets/images/pedido.jpg"
            },
            {
                id: 3,
                title: "Primeira Viagem Juntos",
                date: "Descobrindo Novos Ares",
                desc: "Pé na estrada, músicas no volume máximo, risadas com caminhos errados e a incrível sensação de que viajar para qualquer canto do planeta é perfeito se você estiver no banco do lado.",
                image: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80",
                localImage: "assets/images/viagem.jpg"
            },
            {
                id: 4,
                title: "Momentos Simples e Felizes",
                date: "A Beleza do Dia a Dia",
                desc: "Dividir o cobertor em dias frios, preparar um jantar rápido que queima um pouco, ou simplesmente deitar em silêncio no seu peito ouvindo sua respiração. O amor vive nos menores detalhes.",
                image: "https://images.unsplash.com/photo-1518599904199-0ca897819ddb?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80",
                localImage: "assets/images/dia_a_dia.jpg"
            }
        ];

        // --- Configurações do Three.js ---
        let scene, camera, renderer, controls;
        let starField, heartField;
        let clickableStars = [];
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        const container = document.getElementById('canvas-container');

        function init() {
            // 1. Cena
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.007);

            // 2. Câmera
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.set(0, 0, 150);

            // 3. Renderizador
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            // 4. Controles (OrbitControls)
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxDistance = 300;
            controls.minDistance = 30;

            // 5. Luzes
            const ambientLight = new THREE.AmbientLight(0x333333);
            scene.add(ambientLight);

            const pointLight1 = new THREE.PointLight(0xec4899, 2, 200);
            pointLight1.position.set(0, 0, 10);
            scene.add(pointLight1);

            const pointLight2 = new THREE.PointLight(0x9333ea, 2, 200);
            pointLight2.position.set(50, 50, 50);
            scene.add(pointLight2);

            // 6. Criar Galáxia Espiral Geral
            createSpiralGalaxy();

            // 7. Criar Constelação de Coração
            createHeartConstellation();

            // 8. Criar Estrelas de Memórias (Clicáveis)
            createMemoryStars();

            // Event Listeners
            window.addEventListener('resize', onWindowResize);
            renderer.domElement.addEventListener('click', onDocumentClick);
            renderer.domElement.addEventListener('mousemove', onDocumentMouseMove);
        }

        // --- Criar Partículas da Galáxia Espiral ---
        function createSpiralGalaxy() {
            const count = 3500;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);

            const colorInside = new THREE.Color('#ec4899'); // Rosa
            const colorOutside = new THREE.Color('#4338ca'); // Indigo/Azul

            for (let i = 0; i < count; i++) {
                // Braços da espiral
                const r = Math.random() * 120;
                const spinAngle = r * 0.1;
                const branchAngle = ((i % 3) * 2 * Math.PI) / 3;

                const x = Math.cos(branchAngle + spinAngle) * r + (Math.random() - 0.5) * 12;
                const y = (Math.random() - 0.5) * 8;
                const z = Math.sin(branchAngle + spinAngle) * r + (Math.random() - 0.5) * 12;

                positions[i * 3] = x;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = z;

                // Gradiente de cores da galáxia (Centro quente, pontas frias)
                const mixedColor = colorInside.clone().lerp(colorOutside, r / 120);
                colors[i * 3] = mixedColor.r;
                colors[i * 3 + 1] = mixedColor.g;
                colors[i * 3 + 2] = mixedColor.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            // Textura redonda para partículas
            const pMaterial = new THREE.PointsMaterial({
                size: 1.5,
                vertexColors: true,
                transparent: true,
                opacity: 0.6,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            starField = new THREE.Points(geometry, pMaterial);
            scene.add(starField);
        }

        // --- Criar Constelação Tridimensional em Formato de Coração ---
        function createHeartConstellation() {
            const count = 1200;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);

            const heartColor = new THREE.Color('#f472b6'); // Rosa suave

            for (let i = 0; i < count; i++) {
                // Equações paramétricas da curva de coração em 3D
                const t = Math.PI * 2 * (i / count);
                
                // Equação clássica de coração em 2D escalada
                const scale = 2.0;
                const x = 16 * Math.pow(Math.sin(t), 3) * scale;
                const y = (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * scale;
                // Adicionando profundidade em Z
                const z = (Math.random() - 0.5) * 10 + Math.sin(t * 3) * 5;

                positions[i * 3] = x;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = z;

                colors[i * 3] = heartColor.r + (Math.random() - 0.5) * 0.1;
                colors[i * 3 + 1] = heartColor.g;
                colors[i * 3 + 2] = heartColor.b + 0.1;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const heartMaterial = new THREE.PointsMaterial({
                size: 2.2,
                vertexColors: true,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            heartField = new THREE.Points(geometry, heartMaterial);
            // Rotacionar ligeiramente para ficar charmoso na cena
            heartField.rotation.x = 0.3;
            heartField.rotation.y = 0.2;
            scene.add(heartField);
        }

        // --- Criar Estrelas Clicáveis (Esferas brilhantes de memórias) ---
        function createMemoryStars() {
            const colors = [0xff4da6, 0xbf55ec, 0xf39c12, 0x22a7f0, 0x00e676];
            
            // Posições no coração ou ao redor dele
            const positions = [
                new THREE.Vector3(-25, 15, 5),   // Estrela 1: O Começo
                new THREE.Vector3(25, 15, -5),    // Estrela 2: Primeiro Encontro
                new THREE.Vector3(-15, -15, 0),  // Estrela 3: Pedido
                new THREE.Vector3(15, -15, 2),   // Estrela 4: Viagem
                new THREE.Vector3(0, 0, 10)       // Estrela 5: Dia a Dia
            ];

            const starGeo = new THREE.SphereGeometry(3.5, 24, 24);

            memories.forEach((mem, index) => {
                // Criar malha básica
                const color = colors[index];
                const starMat = new THREE.MeshBasicMaterial({
                    color: color,
                    transparent: true,
                    opacity: 0.9,
                    blending: THREE.AdditiveBlending
                });

                const mesh = new THREE.Mesh(starGeo, starMat);
                mesh.position.copy(positions[index]);
                mesh.userData = { memoryId: mem.id, originalScale: 1.0 };
                scene.add(mesh);
                clickableStars.push(mesh);

                // Criar anel/halo de brilho ao redor
                const ringGeo = new THREE.RingGeometry(4.5, 6, 32);
                const ringMat = new THREE.MeshBasicMaterial({
                    color: color,
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: 0.3
                });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.position.copy(positions[index]);
                ring.lookAt(camera.position);
                scene.add(ring);
                mesh.userData.halo = ring;
            });
        }

        // --- Interações de Mouse (Glow/Hover) ---
        function onDocumentMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(clickableStars);

            // Resetar escalas de todas
            clickableStars.forEach(star => {
                star.scale.set(1, 1, 1);
                star.userData.halo.scale.set(1, 1, 1);
                star.material.opacity = 0.9;
            });

            // Dar escala à que está em hover
            if (intersects.length > 0) {
                document.body.style.cursor = 'pointer';
                const hit = intersects[0].object;
                hit.scale.set(1.3, 1.3, 1.3);
                hit.userData.halo.scale.set(1.3, 1.3, 1.3);
                hit.material.opacity = 1.0;
            } else {
                document.body.style.cursor = 'auto';
            }
        }

        // --- Evento de Clique (Raycast & Abrir Modal) ---
        function onDocumentClick(event) {
            // Impedir clique se a câmera foi arrastada (evitar falsos cliques ao arrastar)
            if (controls.state !== -1) return; 

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(clickableStars);

            if (intersects.length > 0) {
                const clickedStar = intersects[0].object;
                const memoryId = clickedStar.userData.memoryId;
                const memory = memories.find(m => m.id === memoryId);

                if (memory) {
                    // Focar a câmera suavemente na estrela clicada
                    focusCameraOn(clickedStar.position);
                    openMemoryModal(memory);
                }
            }
        }

        // --- Transição Suave de Foco da Câmera ---
        function focusCameraOn(position) {
            // Rotacionar controles em direção à estrela
            const targetPos = position.clone().add(new THREE.Vector3(0, 0, 40));
            
            // Animação manual simplificada
            let step = 0;
            const totalSteps = 30;
            
            function animateTransition() {
                if (step < totalSteps) {
                    camera.position.lerp(targetPos, 0.1);
                    controls.target.lerp(position, 0.1);
                    step++;
                    requestAnimationFrame(animateTransition);
                }
            }
            animateTransition();
        }

        // --- Controle de Modais de Memórias ---
        const modal = document.getElementById('memory-modal');
        const modalContent = document.getElementById('modal-content');
        const mImage = document.getElementById('memory-image');
        const mTitle = document.getElementById('memory-title');
        const mDate = document.getElementById('memory-date');
        const mDesc = document.getElementById('memory-desc');

        function openMemoryModal(memory) {
            mDate.innerText = memory.date;
            mTitle.innerText = memory.title;
            mDesc.innerText = memory.desc;

            // Tentativa de carregar a imagem local com fallback automático para a da web
            mImage.src = memory.localImage;
            mImage.onerror = () => {
                mImage.src = memory.image;
                mImage.onerror = null;
            };

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
            }, 10);
        }

        function closeMemoryModal() {
            modal.classList.add('opacity-0');
            modalContent.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        // Redimensionamento
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Loop de Animação Principal
        function animate(time) {
            requestAnimationFrame(animate);

            // Rotação suave da galáxia de fundo e do coração
            if (starField) starField.rotation.y = time * 0.00003;
            if (heartField) heartField.rotation.y = time * 0.00006;

            // Fazer os halos das estrelas sempre olharem para a câmera (billboarding)
            clickableStars.forEach(star => {
                star.userData.halo.lookAt(camera.position);
                // Pulsação sutil na escala
                const pulse = 1.0 + Math.sin(time * 0.003 + star.userData.memoryId) * 0.08;
                star.scale.set(pulse * star.scale.x, pulse * star.scale.y, pulse * star.scale.z);
            });

            controls.update();
            renderer.render(scene, camera);
        }

        // Iniciar
        init();
        animate();
    </script>
</body>
</html>
